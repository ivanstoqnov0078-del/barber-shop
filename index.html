<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barber Shop | Кюстендил</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
    line-height: 1.6;
}

header {
    min-height: 420px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 30px;
background-image: linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.75)), url("ChatGPT Image Oct 7, 2026, 12_40_39 PM.png");
background-size: cover;
background-position: center;    (rgba(0,0,0,0.65), rgba(0,0,0,0.8)), #222;
}

header h1 {
    font-size: 55px;
    letter-spacing: 5px;
    margin-bottom: 15px;
}

header p {
    font-size: 20px;
    color: #ccc;
}

.container {
    max-width: 1000px;
    margin: auto;
    padding: 60px 20px;
}

section {
    margin-bottom: 60px;
}

h2 {
    font-size: 32px;
    margin-bottom: 25px;
    border-left: 4px solid #c9a227;
    padding-left: 15px;
}

.services {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
}

.service {
    background: #1c1c1c;
    padding: 25px;
    border-radius: 12px;
    border: 1px solid #333;
}

.service h3 {
    margin-bottom: 10px;
    font-size: 21px;
}

.price {
    color: #c9a227;
    font-size: 22px;
    font-weight: bold;
}

.info {
    background: #1c1c1c;
    padding: 30px;
    border-radius: 12px;
    margin-bottom: 20px;
}

.info p {
    margin: 10px 0;
    font-size: 18px;
}

.phone {
    color: #c9a227;
    text-decoration: none;
    font-weight: bold;
}

footer {
    text-align: center;
    padding: 30px;
    background: #080808;
    color: #888;
}

@media (max-width: 600px) {
    header h1 {
        font-size: 38px;
    }

    header {
        min-height: 350px;
    }

    h2 {
        font-size: 27px;
    }
}
</style>
</head>

<body>

<header>
    <div>
        <h1>BARBER SHOP</h1>
        <p>Твоят стил. Твоят избор.</p>
    </div>
</header>

<div class="container">

<section>
    <h2>Услуги и цени</h2>

    <div class="services">

        <div class="service">
            <h3>Подстригване</h3>
            <p class="price">7 €</p>
        </div>

        <div class="service">
            <h3>Вежди</h3>
            <p class="price">2 €</p>
        </div>

        <div class="service">
            <h3>Брада</h3>
            <p class="price">3 €</p>
        </div>

        <div class="service">
            <h3>Комплект</h3>
            <p class="price">10 €</p>
        </div>

    </div>
</section>

<section>
    <h2>Работно време</h2>

    <div class="info">
        <p>📅 От неделя до петък</p>
        <p>🕐 13:00 – 20:00</p>
    </div>
</section>

<section>
    <h2>Контакти</h2>

    <div class="info">
        <p>📞 Телефон:
            <a class="phone" href="tel:0896030094">
                0896030094
            </a>
        </p>

        <p>📍 Адрес: ул. Банска 36, Кюстендил</p>
    </div>
</section>

</div>

<footer>
    © 2026 Barber Shop – Кюстендил
</footer>

</body>
</html>
